; modules.conf - Carga de modulos
; chan_sip (el driver SIP antiguo) y PJSIP intentan abrir el puerto UDP 5060.
; Para evitar el conflicto se desactiva chan_sip y se usa solo PJSIP.
[modules]
autoload=yes
noload => chan_sip.so
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so
noload => pbx_gtkconsole.so
noload => pbx_kdeconsole.so
load => res_musiconhold.so

[global]
