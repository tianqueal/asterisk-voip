; voicemail.conf - Buzones de voz
[general]
format=wav49|gsm|wav        ; formatos en los que se guardan los mensajes
serveremail=asterisk
attach=no                   ; no se envian por correo (no hay servidor de correo)
maxmsg=100
maxsecs=180                 ; duracion maxima de un mensaje
minsecs=2
maxlogins=3
skipms=3000

[zonemessages]
madrid=Europe/Madrid|'vm-received' Q 'digits/at' HM

[default]
; buzon => PIN,Nombre,email,email_aviso,opciones
1001 => 1234,Usuario 1001,,,tz=madrid
1002 => 1234,Usuario 1002,,,tz=madrid
