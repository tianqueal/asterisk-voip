; =====================================================================
; extensions.conf - Plan de marcado del trabajo CDA
;
;   1001, 1002      llamada entre los dos moviles (si no contesta, buzon)
;   600             consultar mi buzon de voz (pide el PIN)
;   6001, 6002      dejar un mensaje directamente en el buzon de 1001/1002
;   500             prueba de eco (para comprobar el audio)
; =====================================================================
[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; Contexto al que llegan las llamadas de los endpoints (context=internos)
[internos]

; --- Llamada entre extensiones, con buzon de voz si no hay respuesta ---
exten => _100[12],1,NoOp(Llamada de ${CALLERID(num)} a ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n,GotoIf($["${DIALSTATUS}" = "CANCEL"]?fin)
 same => n,Voicemail(${EXTEN}@default,u)    ; no contesta / no disponible
 same => n,Hangup()
 same => n(ocupado),Voicemail(${EXTEN}@default,b)
 same => n(fin),Hangup()

; --- Consultar el buzon propio (el numero se toma del que llama) ---
exten => 600,1,NoOp(Consulta de buzon de ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; --- Llamar directamente al buzon de otra extension (6001 -> buzon 1001) ---
exten => _600[12],1,NoOp(Buzon directo de 1${EXTEN:1})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Voicemail(1${EXTEN:1}@default,u)
 same => n,Hangup()

; --- Prueba de eco ---
exten => 500,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

[mensajes-internos]
exten => _100[12],1,NoOp(Mensaje de ${MESSAGE(from)} a ${EXTEN})
 same => n,MessageSend(pjsip:${EXTEN}, ${MESSAGE(from)})
 same => n,Hangup()
