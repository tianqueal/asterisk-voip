; ============================================================================
; Asterisk PJSIP Configuration (pjsip.conf)
; ============================================================================

; ---------------------------------------------------------------------
; Transporte: escucha SIP por UDP en el puerto 5060 en todas las
; interfaces (la NAT 10.0.2.15 y la puente, que es la que ven los moviles).
; ---------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------------
; Plantillas (se marcan con '!')
; ---------------------------------------------------------------------
[plantilla-endpoint](!)
type=endpoint
transport=transport-udp
context=internos            ; contexto de extensions.conf al que entran sus llamadas
disallow=all
allow=ulaw,alaw,h264,vp8    ; audio G.711 y video H.264/VP8 (Linphone y Zoiper)
direct_media=no             ; el audio pasa siempre por Asterisk
rtp_symmetric=yes           ; envia el RTP al origen del que recibe (ayuda con NAT/wifi)
force_rport=yes
rewrite_contact=yes
language=es                 ; locuciones en español
voicemail_extension=600     ; numero que marca el movil para consultar su buzon

[plantilla-auth](!)
type=auth
auth_type=userpass

[plantilla-aor](!)
type=aor
max_contacts=1              ; un solo movil registrado por extension
remove_existing=yes         ; un registro nuevo sustituye al anterior
; No se usa qualify_frequency: los moviles en reposo no siempre contestan a
; los OPTIONS y Asterisk los marcaria como "Unavailable" (la llamada iria
; directa al buzon aunque el movil siga registrado).

; ---------------------------------------------------------------------
; Extension 1001
; (endpoint, auth y aor comparten nombre; cada uno es de un "type")
; ---------------------------------------------------------------------
[1001](plantilla-endpoint)
auth=1001
aors=1001
callerid="Usuario 1001" <1001>
mailboxes=1001@default

[1001](plantilla-auth)
username=1001
password=CDA2627-1001

[1001](plantilla-aor)
mailboxes=1001@default

; ---------------------------------------------------------------------
; Extension 1002
; ---------------------------------------------------------------------
[1002](plantilla-endpoint)
auth=1002
aors=1002
callerid="Usuario 1002" <1002>
mailboxes=1002@default

[1002](plantilla-auth)
username=1002
password=CDA2627-1002

[1002](plantilla-aor)
mailboxes=1002@default
